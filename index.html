<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadowing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: video + live subtitle log side by side on top, step-by-step practice deck below. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --ink: #16202d;
  --muted: #5a6677;
  --line: #d9e0e8;
  --accent: #2453c9;
  --accent-ink: #ffffff;
  --accent-soft: #e3eaff;
  --rec: #d1343a;
  --rec-soft: #fde7e8;
  --ok: #1d7f48;
  --ok-soft: #e1f3e8;
  --bad: #c22d33;
  --bad-soft: #fbe4e5;
  --warn: #9a5c00;
  --warn-soft: #fff0d6;
  --shadow: 0 1px 2px rgba(22, 32, 45, .06), 0 4px 16px rgba(22, 32, 45, .05);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #171e28; --surface-2: #1d2531; --ink: #e6ebf2; --muted: #98a4b5;
    --line: #2b3544; --accent: #7fa2ff; --accent-ink: #0d1424; --accent-soft: #1f2c4d;
    --rec: #ff6b70; --rec-soft: #3a1d21; --ok: #5fd08f; --ok-soft: #173326; --bad: #ff7d81;
    --bad-soft: #3a1c1f; --warn: #f0b35a; --warn-soft: #3a2c14;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #171e28; --surface-2: #1d2531; --ink: #e6ebf2; --muted: #98a4b5;
  --line: #2b3544; --accent: #7fa2ff; --accent-ink: #0d1424; --accent-soft: #1f2c4d;
  --rec: #ff6b70; --rec-soft: #3a1d21; --ok: #5fd08f; --ok-soft: #173326; --bad: #ff7d81;
  --bad-soft: #3a1c1f; --warn: #f0b35a; --warn-soft: #3a2c14;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}

* { box-sizing: border-box; }
/* The hidden attribute must win over component display rules (e.g. .video-msg { display: grid }). */
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.6 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); line-height: 1.2; text-wrap: balance; margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px;
  padding-block: 14px; padding-inline: max(16px, 3vw);
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { font-size: 1.25rem; letter-spacing: -.01em; }
.brand span { color: var(--muted); font-size: .85rem; }
.load-form { display: flex; gap: 8px; flex: 1 1 420px; min-width: 0; }
.load-form input {
  flex: 1; min-width: 0; padding: 9px 12px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--surface-2);
}

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; font-weight: 600; font-size: .9rem;
  transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.rec { background: var(--rec); color: #fff; border-color: var(--rec); }
.btn.rec.on { animation: pulse 1.2s infinite; }
.btn.small { padding: 4px 9px; font-size: .8rem; }
.btn.ghost { background: transparent; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--rec-soft); } }
@media (prefers-reduced-motion: reduce) { .btn.rec.on { animation: none; } * { scroll-behavior: auto !important; } }

main { padding-block: 20px 48px; padding-inline: max(16px, 3vw); display: grid; gap: 20px; max-width: 1400px; margin: 0 auto; }

/* ---------- stage: video + subtitles ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.video-col { display: grid; gap: 10px; min-width: 0; }
.video-wrap {
  position: relative; aspect-ratio: 16 / 9; max-width: 100%;
  background: #000; border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
}
.video-wrap iframe, .video-wrap #player { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-msg {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 10px;
  text-align: center; color: #e9eef5; background: #10161f; padding: 24px;
}
.video-msg a { color: #9db7ff; }
.now-caption {
  min-height: 3.2em; padding: 10px 14px; border-radius: var(--radius);
  background: var(--surface); border: 1px solid var(--line);
  font-size: 1.08rem; font-weight: 600; display: flex; gap: 10px; align-items: center;
}
.now-caption .mono { color: var(--muted); font-size: .8rem; font-weight: 400; }
.video-title { color: var(--muted); font-size: .9rem; }

.subs {
  display: flex; flex-direction: column; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); height: clamp(320px, 52vw * .5625 + 4.5em, 640px);
}
.subs-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.subs-head h2 { font-size: 1rem; margin-right: auto; }
.subs-head label { font-size: .82rem; color: var(--muted); display: flex; gap: 4px; align-items: center; }
.subs-head input[type="search"] {
  flex-basis: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); min-width: 0;
}
.sub-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; position: relative; }
.sub-list li {
  display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: start;
  padding: 6px 8px; border-radius: 6px; cursor: pointer;
}
.sub-list li:hover { background: var(--surface-2); }
.sub-list li.active { background: var(--accent-soft); }
.sub-list li.active .txt { font-weight: 600; }
.sub-list .ts { color: var(--accent); font-size: .78rem; padding-top: 3px; background: none; border: 0; cursor: pointer; }
.sub-list .txt { min-width: 0; }
.sub-list .mic { opacity: 0; }
.sub-list li:hover .mic, .sub-list li.active .mic, .sub-list .mic:focus-visible { opacity: 1; }
.subs-empty { padding: 24px 16px; color: var(--muted); }
.sub-list .who { display: inline-block; margin-right: 6px; font-size: .72rem; letter-spacing: .03em; color: var(--muted); text-transform: uppercase; }
/* ---------- practice ---------- */
.practice { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.stepper { display: flex; gap: 4px; padding: 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.step-chip {
  display: flex; align-items: center; gap: 6px; white-space: nowrap;
  padding: 7px 12px; border-radius: 999px; border: 1px solid transparent;
  background: transparent; cursor: pointer; font-weight: 600; font-size: .88rem; color: var(--muted);
}
.step-chip .n { font-family: var(--font-mono); font-size: .75rem; width: 20px; height: 20px; display: grid; place-content: center; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); }
.step-chip.current { color: var(--ink); border-color: var(--accent); background: var(--accent-soft); }
.step-chip.current .n { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step-chip.done .n { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.panel { padding: 22px clamp(16px, 3vw, 32px); min-height: 280px; display: grid; gap: 18px; align-content: start; }
.panel h2 { font-size: 1.35rem; }
.panel .lead { color: var(--muted); margin: -10px 0 0; }
.step-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--radius) var(--radius); }
.step-nav .count { color: var(--muted); font-size: .85rem; }

.article { max-width: 68ch; display: grid; gap: 12px; font-size: 1.02rem; }
.article p { margin: 0; }
.summary { max-width: 68ch; background: var(--surface-2); border-radius: 8px; padding: 14px 18px 14px 34px; margin: 0; }
.summary li + li { margin-top: 4px; }
.label { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; min-width: 820px; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
th { background: var(--surface-2); font-size: .78rem; color: var(--muted); font-weight: 700; }
tr:last-child td { border-bottom: 0; }
td.word { font-weight: 700; white-space: nowrap; }
td .quote { font-style: italic; }

/* shadowing */
.shadow-picks { display: flex; flex-wrap: wrap; gap: 6px; }
.pick { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: .82rem; display: flex; gap: 6px; align-items: center; }
.pick.current { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.pick .sc { font-family: var(--font-mono); font-size: .72rem; padding: 0 5px; border-radius: 4px; }
.sc.good { background: var(--ok-soft); color: var(--ok); }
.sc.mid { background: var(--warn-soft); color: var(--warn); }
.sc.low { background: var(--bad-soft); color: var(--bad); }
.target { font-size: clamp(1.15rem, 2.2vw, 1.5rem); font-weight: 600; line-height: 1.5; font-family: var(--font-display); }
.target-meta { color: var(--muted); font-size: .85rem; }
.ctrl-group { display: grid; gap: 8px; }
.ctrl-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rec-status { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rec); }
.live { min-height: 1.6em; color: var(--muted); font-style: italic; }
.result { display: grid; gap: 14px; padding: 16px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); }
.score-line { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score-num { font-family: var(--font-display); font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.diff { font-size: 1.15rem; line-height: 2.3; }
.w { display: inline-block; padding: 0 3px; border-radius: 4px; margin-right: 2px; position: relative; }
.w.ok { color: var(--ok); }
.w.bad { background: var(--bad-soft); color: var(--bad); font-weight: 700; }
.w.miss { color: var(--bad); text-decoration: line-through dashed; opacity: .85; }
.w .heard { position: absolute; left: 0; top: 1.5em; font-size: .68rem; line-height: 1; white-space: nowrap; color: var(--muted); font-weight: 500; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .78rem; color: var(--muted); }
.issues { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.issues li { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: .9rem; }
.issues b { min-width: 6em; }
audio { width: 100%; max-width: 480px; height: 36px; }
.note { font-size: .8rem; color: var(--muted); }
details.dict { border-top: 1px dashed var(--line); padding-top: 12px; }
details.dict summary { cursor: pointer; font-weight: 600; }

/* quiz */
.q-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.q-text { font-size: 1.1rem; font-weight: 600; max-width: 68ch; }
.options { display: grid; gap: 8px; max-width: 560px; }
.opt { text-align: left; padding: 11px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; display: flex; gap: 10px; }
.opt .k { font-family: var(--font-mono); color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.feedback { padding: 12px 14px; border-radius: 8px; max-width: 68ch; }
.feedback.ok { background: var(--ok-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback.info { background: var(--surface-2); border: 1px solid var(--line); }
.feedback b { display: block; margin-bottom: 2px; }
.text-in { width: 100%; max-width: 560px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
textarea.text-in { min-height: 84px; resize: vertical; }
.cloze-sent { font-size: 1.15rem; font-weight: 600; }
.cloze-sent .blank { display: inline-block; min-width: 5em; border-bottom: 2px solid var(--accent); text-align: center; color: var(--accent); }
.kw { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .8rem; margin: 2px 4px 2px 0; }
.kw.hit { background: var(--ok-soft); color: var(--ok); }
.kw.miss { background: var(--bad-soft); color: var(--bad); }

/* results */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.stat { padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.stat .v { font-family: var(--font-display); font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat .l { font-size: .8rem; color: var(--muted); }
.review { display: flex; flex-wrap: wrap; gap: 6px; }
.empty { padding: 18px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); display: grid; gap: 10px; max-width: 68ch; }
.gen-row { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--ink); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.empty .text-in { max-width: 420px; }
.gen-opt { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.gen-opt > .label { text-transform: none; letter-spacing: normal; font-size: .92rem; color: var(--ink); }
.empty code { font-family: var(--font-mono); background: var(--surface-2); padding: 6px 10px; border-radius: 6px; color: var(--ink); word-break: break-all; }
.history { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.history-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.history-head h2 { font-size: 1rem; margin-right: auto; }
.history-list { list-style: none; margin: 0; padding: 6px; max-height: 320px; overflow-y: auto; }
.history-list li { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 6px; }
.history-list li:hover { background: var(--surface-2); }
.history-list li.current { background: var(--accent-soft); }
.history-item { min-width: 0; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 2px; }
.history-item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-item .u { font-size: .75rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.history-list .when { font-size: .75rem; color: var(--muted); white-space: nowrap; }
.history-empty { padding: 16px; color: var(--muted); }
.banner { padding: 10px 14px; border-radius: 8px; background: var(--warn-soft); color: var(--warn); font-size: .9rem; }

@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .subs { height: 46vh; }
  .sub-list .mic { opacity: 1; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><h1>Shadowing Studio</h1><span>YouTube 英文跟讀練習</span></div>
  <form class="load-form" id="loadForm">
    <input id="urlInput" type="url" placeholder="貼上 YouTube 網址，例如 https://www.youtube.com/watch?v=..." aria-label="YouTube 網址" required>
    <button class="btn primary" type="submit">載入影片</button>
    <button class="btn" id="historyBtn" type="button" aria-expanded="false" aria-controls="historyPanel">歷史紀錄</button>
  </form>
</header>

<main>
  <div class="banner" id="banner" hidden></div>

  <section class="history" id="historyPanel" aria-label="歷史紀錄" hidden>
    <div class="history-head">
      <h2>看過的影片</h2>
      <button class="btn small ghost" id="historyClear" type="button">清除全部</button>
      <button class="btn small" id="historyClose" type="button">關閉</button>
    </div>
    <ol class="history-list" id="historyList"></ol>
  </section>

  <section class="stage">
    <div class="video-col">
      <div class="video-wrap"><div id="player"></div><div class="video-msg" id="videoMsg" hidden></div></div>
      <div class="now-caption" id="nowCaption"><span class="mono">--:--</span><span>按下播放，目前字幕會顯示在這裡</span></div>
      <div class="video-title" id="videoTitle"></div>
    </div>
    <aside class="subs" aria-label="字幕紀錄">
      <div class="subs-head">
        <h2>字幕紀錄</h2>
        <label><input type="checkbox" id="followSubs" checked> 跟隨播放</label>
        <button class="btn small" id="pdfBtn" type="button">下載字幕 PDF</button>
        <input type="search" id="subSearch" placeholder="搜尋字幕…" aria-label="搜尋字幕">
      </div>
      <ol class="sub-list" id="subList"><li class="subs-empty">載入中…</li></ol>
    </aside>
  </section>

  <section class="practice" aria-label="練習">
    <nav class="stepper" id="stepper"></nav>
    <div class="panel" id="panel"></div>
    <div class="step-nav">
      <button class="btn" id="prevStep" type="button">← 上一步</button>
      <span class="count mono" id="stepCount"></span>
      <button class="btn primary" id="nextStep" type="button">下一步 →</button>
    </div>
  </section>
</main>

<script>
'use strict';
const DEFAULT_URL = 'https://www.youtube.com/watch?v=v07kPyPkLYw';
const STEPS = [
  { key: 'article', label: '文章' },
  { key: 'vocab', label: '單字' },
  { key: 'shadow', label: '跟讀' },
  { key: 'mcq', label: '選擇題' },
  { key: 'cloze', label: '克漏字' },
  { key: 'translate', label: '中翻英' },
  { key: 'result', label: '成績' },
];

const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  }
  return e;
}
function fmt(t) {
  t = Math.max(0, Math.floor(t || 0));
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function storeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }

/* ================= state ================= */
const S = {};
function resetState(id) {
  for (const it of (S.shadow?.items || [])) if (it.rec?.url) URL.revokeObjectURL(it.rec.url);
  Object.assign(S, {
    videoId: id, title: '', sentences: [], lesson: null, step: 0, curIdx: -1,
    mcq: { i: 0, res: [] }, cloze: { i: 0, res: [] }, tr: { i: 0, res: [] },

function playSegment(start, end, rate = 1) {
  if (!playerReady) return Promise.resolve();

    segResolve = resolve;
    try { player.setPlaybackRate(rate); } catch { /* ignore */ }

}

/* ================= transcript ================= */
function buildSentences(lines) {
  const words = [];
  lines.forEach((l, i) => {
    const clean = String(l.text).replace(/\[[^\]]*\]/g, ' ').replace(/\s+/g, ' ');
    const next = lines[i + 1];
    const dur = next ? Math.max(0.2, next.start - l.start) : (l.duration || 2);
    const toks = [];
    clean.split('>>').forEach((part, pi) => {
      if (pi > 0) toks.push({ brk: true });
      part.trim().split(' ').filter(Boolean).forEach((w) => toks.push({ w }));
    });
    const wc = toks.filter((x) => x.w).length || 1;
    let k = 0;
    for (const x of toks) {
      if (x.brk) { words.push(x); continue; }
      words.push({ w: x.w, t: l.start + (dur * k) / wc });
      k++;
    }
  });
  const out = [];
  let cur = null;
  // ">>" marks a speaker change; consecutive markers (e.g. ">> [music]") count once.
  let group = 0, pending = false;
  const flush = () => { if (cur && cur.words.length) out.push({ text: cur.words.join(' '), start: cur.start, group: cur.group }); cur = null; };
  for (const x of words) {
    if (x.brk) { flush(); if (out.length) pending = true; continue; }
    if (!cur) {
      if (pending) { group++; pending = false; }
      cur = { words: [], start: x.t, group };
    }
    cur.words.push(x.w);
    if (/[.?!]["”']?$/.test(x.w) && !/^(Mr|Mrs|Ms|Dr)\.$/.test(x.w)) flush();
  }
  flush();
  out.forEach((s, i) => { s.end = out[i + 1] ? Math.min(out[i + 1].start + 0.2, s.start + 15) : s.start + 4; });
  return out;
}
function sentenceAt(t) {
  const a = S.sentences;
  let lo = 0, hi = a.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (a[mid].start <= t + 0.15) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans;
}

/* ================= speakers ================= */
// Priority: lesson.turns (labelled by Claude) > auto detection (">>" markers, re-synced
// at places where someone is addressed by name, e.g. "Okay, Alice," => David speaks).
// Names are detected from the transcript; if none are found, "Speaker A" / "Speaker B".
const NOT_NAMES = new Set(('Okay Yes Well Oh Ooh Ugh Mhm Hmm Ahh Exactly Perfect Right Good Great Wow Really Thanks Please Sorry Hello ' +
  'Hey Everyone Listeners Friends Guys Beautiful Sure Now Ready True English Grandma Mom Dad Sir Madam Baby Seriously ' +
  'Interesting Amazing Correct Absolutely Definitely Maybe Goodbye').split(' '));
function detectNames(sents) {
  const lower = new Set(), count = new Map();
  const voc = /^([A-Z][a-z]{2,}),|,\s+([A-Z][a-z]{2,})(?=\s*[,.?!]|$)/g;
  for (const s of sents) {
    for (const w of s.text.split(/\s+/)) {
      const b = w.replace(/[^A-Za-z']/g, '');
      if (b && b[0] !== b[0].toUpperCase()) lower.add(b.toLowerCase());
    }
    for (const m of s.text.matchAll(voc)) { const n = m[1] || m[2]; count.set(n, (count.get(n) || 0) + 1); }
  }
  // A name is used to address someone (", Alice," / "Alice, ...") and never appears in lowercase.
  const cand = [...count].filter(([n]) => !NOT_NAMES.has(n) && !lower.has(n.toLowerCase())).sort((a, b) => b[1] - a[1]);
  if (!cand.length) return [];
  const min = Math.max(3, Math.ceil(cand[0][1] * 0.3));
  return cand.filter(([, c]) => c >= min).slice(0, 2).map(([n]) => n);
}
function computeSpeakers() {
  const sents = S.sentences, turns = S.lesson?.turns;
  if (Array.isArray(turns) && turns.length) {
    S.spkMode = 'claude';
    const t = [...turns].sort((a, b) => a.start - b.start);
    let k = 0;
    for (const s of sents) {
      while (k + 1 < t.length && t[k + 1].start <= s.start + 0.3) k++;
      s.speaker = t[k].speaker;
    }
    return;
  }
  S.spkMode = 'auto';
  const found = detectNames(sents);
  const names = [found[0] || 'Speaker A', found[1] || 'Speaker B'];
  const reEsc = (n) => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const anchors = [];
  for (const s of sents) {
    found.forEach((n, j) => {
      if (new RegExp('(?:^|,\\s*|\\s)' + reEsc(n) + '(?=\\s*[,.?!]|$)').test(s.text)) anchors.push({ g: s.group, sp: 1 - j });
    });
  }
  const cache = new Map();
  const predict = (g) => {
    if (cache.has(g)) return cache.get(g);
    const v = [0, 0];
    let best = null;
    for (const a of anchors) {
      const d = Math.abs(g - a.g), sp = a.sp ^ ((g - a.g) & 1);
      if (d <= 15) v[sp] += 1 / (1 + d);
      if (!best || d < best.d) best = { d, sp };
    }
    const r = v[0] !== v[1] ? (v[0] > v[1] ? 0 : 1) : best ? best.sp : (g & 1);
    cache.set(g, r);
    return r;
  };
  for (const s of sents) s.speaker = names[predict(s.group)];
}

function parseVideoId(s) {
  s = (s || '').trim();
  if (/^[\w-]{11}$/.test(s)) return s;
  try {
    const u = new URL(s);
    if (u.hostname.endsWith('youtu.be')) return u.pathname.slice(1, 12);
    if (u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
    const m = u.pathname.match(/\/(shorts|embed|live)\/([\w-]{11})/);
    if (m) return m[2];
  } catch { /* not a URL */ }
  return null;
}
async function fetchJSON(u) {
  const r = await fetch(u, { cache: 'no-store' });

}

(async function seedHistoryFromLessons() {
  let lessons;

  let seeded;
  try { seeded = new Set(JSON.parse(storeGet('seededLessons') || '[]')); } catch { seeded = new Set(); }
  const h = getHistory();

async function startGenerate() {

    const s = await fetchJSON('/api/settings');

  } catch (e) {
    Object.assign(GEN, { vid, error: '無法連到 server.py：' + e.message }); renderAll(); return;
  }
  Object.assign(GEN, { running: true, t0: Date.now(), error: '', vid });
  renderAll();
  const timer = setInterval(() => { const s = document.getElementById('genStatus'); if (s) s.textContent = genStatusText(); }, 1000);
  try {
    const r = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ v: vid }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {

      throw new Error(j.error || 'HTTP ' + r.status);
    }
    if (S.videoId === vid) {

      S.title = S.title || j.title || '';
      S.shadow.items = [...(j.shadowing || []).map((x) => ({ ...x })), ...S.shadow.items.filter((x) => x.custom)];

  } catch (e) {

}

/* ================= TTS (browser built-in) ================= */
function say(text, rate = 0.9) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = rate;
  const v = speechSynthesis.getVoices().find((x) => /en[-_]US/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}

/* ================= recording + speech recognition ================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const rec = { stream: null, mr: null, chunks: [], sr: null, srDone: null, final: '', interim: '', active: false, timer: null, t0: 0 };

async function startRecording(onText) {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('這個瀏覽器不支援錄音，請用 Chrome 或 Edge，並從 http://localhost 開啟。');
  if (!rec.stream) rec.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  rec.chunks = [];
  rec.mr = new MediaRecorder(rec.stream);
  rec.mr.ondataavailable = (e) => { if (e.data.size) rec.chunks.push(e.data); };
  rec.mr.start();
  rec.final = ''; rec.interim = ''; rec.sr = null; rec.srDone = null; rec.srError = null;
  if (SR) {
    const sr = new SR();
    sr.lang = 'en-US'; sr.continuous = true; sr.interimResults = true; sr.maxAlternatives = 1;
    sr.onresult = (e) => {
      let fin = '', int = '';
      for (let i = 0; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += r[0].transcript + ' '; else int += r[0].transcript;
      }
      rec.final = fin; rec.interim = int;
      onText((fin + int).trim());
    };
    sr.onerror = (e) => { rec.srError = e.error; };
    rec.srDone = new Promise((res) => { sr.onend = res; });
    try { sr.start(); rec.sr = sr; } catch { rec.sr = null; }
  }
  rec.active = true;
}
async function stopRecording() {
  if (!rec.active) return null;
  rec.active = false;
  const stopped = new Promise((res) => { rec.mr.onstop = res; });
  rec.mr.stop();
  if (rec.sr) { try { rec.sr.stop(); } catch { /* ignore */ } await Promise.race([rec.srDone, sleep(3000)]); }
  await stopped;
  const blob = new Blob(rec.chunks, { type: rec.mr.mimeType || 'audio/webm' });
  return { url: URL.createObjectURL(blob), heard: (rec.final + ' ' + rec.interim).replace(/\s+/g, ' ').trim(), srError: rec.srError, hasSR: !!rec.sr };
}
function stopRecordingIfAny() {
  if (rec.active) { clearInterval(rec.timer); stopRecording(); }

/* ================= word alignment ================= */
const NUM = { zero: '0', one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', eight: '8', nine: '9', ten: '10', eleven: '11', twelve: '12', fifteen: '15', twenty: '20', thirty: '30', hundred: '100', ok: 'okay' };
const norm = (w) => {
  const n = String(w).toLowerCase().replace(/[’‘]/g, "'").replace(/[^a-z0-9']/g, '').replace(/^'+|'+$/g, '');
  return NUM[n] || n;
};
const tokenize = (s) => String(s).split(/\s+/).map((raw) => ({ raw, n: norm(raw) })).filter((x) => x.n);
function align(targetText, heardText) {
  const a = tokenize(targetText), b = tokenize(heardText);
  const n = a.length, m = b.length;
  const D = Array.from({ length: n + 1 }, (_, i) => { const r = new Array(m + 1).fill(0); r[0] = i; return r; });
  for (let j = 0; j <= m; j++) D[0][j] = j;
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++) {
    D[i][j] = Math.min(D[i - 1][j] + 1, D[i][j - 1] + 1, D[i - 1][j - 1] + (a[i - 1].n === b[j - 1].n ? 0 : 1));
  }
  const ops = [];
  let i = n, j = m;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && D[i][j] === D[i - 1][j - 1] + (a[i - 1].n === b[j - 1].n ? 0 : 1)) {
      ops.unshift(a[i - 1].n === b[j - 1].n ? { type: 'ok', t: a[i - 1].raw } : { type: 'bad', t: a[i - 1].raw, h: b[j - 1].raw });
      i--; j--;
    } else if (i > 0 && D[i][j] === D[i - 1][j] + 1) { ops.unshift({ type: 'miss', t: a[i - 1].raw }); i--; }
    else { ops.unshift({ type: 'extra', h: b[j - 1].raw }); j--; }
  }
  const ok = ops.filter((o) => o.type === 'ok').length;
  return { ops, score: n ? Math.round((ok / n) * 100) : 0 };
}
const scoreClass = (s) => (s >= 90 ? 'good' : s >= 70 ? 'mid' : 'low');
const scoreWord = (s) => (s >= 90 ? '很棒，幾乎都聽得懂' : s >= 70 ? '不錯，再修正紅字的部分' : '再聽一次原句，放慢速度跟讀');

function renderDiff(result, vocab) {
  const bareWord = (w) => w.replace(/^[^\w']+|[^\w']+$/g, '');
  const diff = el('div', { class: 'diff' }, ...result.ops.filter((o) => o.type !== 'extra').map((o) => {
    if (o.type === 'ok') return el('span', { class: 'w ok', text: o.t });
    if (o.type === 'bad') return el('span', { class: 'w bad', title: '辨識成：' + o.h }, o.t, el('span', { class: 'heard', text: '→ ' + o.h }));
    return el('span', { class: 'w miss', title: '沒有辨識到', text: o.t });
  }));
  const extras = result.ops.filter((o) => o.type === 'extra').map((o) => o.h);
  const problems = [];
  const seen = new Set();
  for (const o of result.ops) {
    if (o.type !== 'bad' && o.type !== 'miss') continue;
    const w = bareWord(o.t); const key = w.toLowerCase();
    if (!w || seen.has(key)) continue;
    seen.add(key);
    const v = (vocab || []).find((x) => x.word.toLowerCase().split(' ').includes(key));
    problems.push(el('li', {},
      el('b', { text: w }),
      el('span', { text: o.type === 'bad' ? `系統聽成「${o.h}」` : '系統沒聽到這個字（可能太小聲、太快或被吞音）' }),
      v ? el('span', { class: 'mono', text: v.word + ' ' + v.kk }) : null,
      el('button', { class: 'btn small', type: 'button', text: '標準發音', onclick: () => say(w, 0.8) }),
      el('button', { class: 'btn small ghost', type: 'button', text: '慢速', onclick: () => say(w, 0.5) })));
  }
  return [
    diff,
    el('div', { class: 'legend' },
      el('span', {}, el('span', { class: 'w ok', text: 'word' }), ' 正確'),
      el('span', {}, el('span', { class: 'w bad', text: 'word' }), ' 發音被聽成別的字'),
      el('span', {}, el('span', { class: 'w miss', text: 'word' }), ' 漏念／沒聽到')),
    extras.length ? el('div', { class: 'note', text: '多念的字：' + extras.join(' ') }) : null,
    problems.length ? el('div', { class: 'label', text: '需要加強的字' }) : null,
    problems.length ? el('ul', { class: 'issues' }, ...problems) : null,
  ];
}

  }, el('span', { class: 'k', text: 'ABCD'[k] }), el('span', { text: o }))));
  return [
    quizHeader('選擇題（字義）', st.i, total),
    el('div', { class: 'q-text', text: q.q }),
    opts,
    r ? el('div', { class: 'feedback ' + (r.ok ? 'ok' : 'bad') }, el('b', { text: r.ok ? '答對了' : '答錯了，正確答案是 ' + 'ABCD'[q.answer] }), q.explain) : null,
    r ? el('div', {}, el('button', { class: 'btn primary', type: 'button', text: st.i + 1 < total ? '下一題 →' : '看結果', onclick: () => { st.i++; renderAll(); } })) : null,
  ];
}

/* ================= step: cloze ================= */
function viewCloze() {
  const L = S.lesson;
  if (!L) return [el('h2', { text: '克漏字' }), emptyLesson('克漏字題')];
  const st = S.cloze, total = L.cloze.length;
  if (st.i >= total) return quizDone('克漏字', st.res, total, () => { S.cloze = { i: 0, res: [] }; });
  const q = L.cloze[st.i], r = st.res[st.i];
  const parts = q.sentence.split(/_{3,}/);
  const sent = el('div', { class: 'cloze-sent' }, parts[0], el('span', { class: 'blank', text: r ? q.answer : '?' }), parts.slice(1).join(''));
  const input = el('input', { class: 'text-in', id: 'clozeInput', placeholder: '輸入答案後按 Enter', autocomplete: 'off', disabled: !!r, value: r ? r.given : null });
  const form = el('form', { class: 'ctrl-row', onsubmit: (e) => {
    e.preventDefault();
    if (r || !input.value.trim()) return;
    st.res[st.i] = { ok: norm(input.value.trim()) === norm(q.answer), given: input.value.trim() };
    renderAll();
  } }, input, el('button', { class: 'btn primary', type: 'submit', text: '送出', disabled: !!r }));
  const out = [
    quizHeader('克漏字', st.i, total),
    sent,
    el('div', { class: 'note', text: '提示：' + q.hint }),
    form,
  ];
  if (r) {
    out.push(el('div', { class: 'feedback ' + (r.ok ? 'ok' : 'bad') }, el('b', { text: r.ok ? '答對了' : `答錯了：你寫「${r.given}」，正確是「${q.answer}」` }), q.explain));
    out.push(el('div', {}, el('button', { class: 'btn primary', type: 'button', text: st.i + 1 < total ? '下一題 →' : '看結果', onclick: () => { st.i++; renderAll(); } })));
  } else setTimeout(() => input.focus({ preventScroll: true }), 0);
  return out;
}

/* ================= step: translation ================= */
function viewTranslate() {
  const L = S.lesson;
  if (!L) return [el('h2', { text: '中翻英' }), emptyLesson('中翻英題')];
  const st = S.tr, total = L.translate.length;
  if (st.i >= total) return quizDone('中翻英', st.res, total, () => { S.tr = { i: 0, res: [] }; });
  const q = L.translate[st.i], r = st.res[st.i];
  const ta = el('textarea', { class: 'text-in', id: 'trInput', placeholder: '用英文寫出這句話', disabled: !!(r && r.checked) });
  if (r) ta.value = r.answer;
  const out = [quizHeader('中翻英', st.i, total), el('div', { class: 'q-text', text: q.zh }),
    el('div', { class: 'note' }, '試著用上：', ...q.keywords.map((k) => el('span', { class: 'kw', style: 'background:var(--surface-2)', text: k }))), ta];
  if (!r || !r.checked) {
    out.push(el('div', {}, el('button', { class: 'btn primary', type: 'button', text: '送出，看參考答案', onclick: () => {
      if (!ta.value.trim()) { ta.focus(); return; }
      st.res[st.i] = { answer: ta.value.trim(), checked: true };
      renderAll();
    } })));
    return out;
  }
  const lower = r.answer.toLowerCase().replace(/[’‘]/g, "'");
  const hits = q.keywords.map((k) => ({ k, hit: lower.includes(k.toLowerCase()) }));
  out.push(
    el('div', { class: 'feedback info' },
      el('b', { text: '參考答案' }), q.reference,
      el('div', { style: 'margin-top:8px' }, ...hits.map((h) => el('span', { class: 'kw ' + (h.hit ? 'hit' : 'miss'), text: (h.hit ? '✓ ' : '✗ ') + h.k })))),
    el('div', { class: 'note', text: '這一題沒有標準答案，請對照參考答案自評。想要逐句批改文法，可以把答案複製到 Claude Code。' }),
    el('div', { class: 'ctrl-row' },
      el('button', { class: 'btn' + (r.ok === true ? ' primary' : ''), type: 'button', text: '我寫對了', onclick: () => { r.ok = true; renderAll(); } }),
      el('button', { class: 'btn' + (r.ok === false ? ' primary' : ''), type: 'button', text: '需要加強', onclick: () => { r.ok = false; renderAll(); } }),
      copyBtn(`請幫我批改中翻英（指出文法或用字問題，並給較自然的說法）：\n題目：${q.zh}\n我的答案：${r.answer}`, '複製給 Claude 批改')),
  );
  if (r.ok !== undefined) out.push(el('div', {}, el('button', { class: 'btn primary', type: 'button', text: st.i + 1 < total ? '下一題 →' : '看結果', onclick: () => { st.i++; renderAll(); } })));
  return out;
}

/* ================= step: results ================= */
function viewResult() {
  const L = S.lesson;
  const items = S.shadow.items.filter((x) => x.rec && x.rec.hasSR && x.rec.heard);
  const avg = items.length ? Math.round(items.reduce((a, x) => a + x.rec.score, 0) / items.length) : null;
  const stat = (v, l) => el('div', { class: 'stat' }, el('div', { class: 'v', text: v }), el('div', { class: 'l', text: l }));
  const frac = (res, total) => `${res.filter((r) => r && r.ok).length} / ${total}`;
  const out = [el('h2', { text: '練習成績' })];
  out.push(el('div', { class: 'stats' },
    stat(avg == null ? '—' : avg, `跟讀平均分數（${items.length} 句）`),
    L ? stat(frac(S.mcq.res, L.mcq.length), '選擇題') : null,
    L ? stat(frac(S.cloze.res, L.cloze.length), '克漏字') : null,
    L ? stat(frac(S.tr.res, L.translate.length), '中翻英（自評）') : null));
  if (L) {
    const all = [...S.mcq.res, ...S.cloze.res, ...S.tr.res].filter(Boolean);
    const okN = all.filter((r) => r.ok).length;
    const totalN = L.mcq.length + L.cloze.length + L.translate.length;
    out.push(el('div', { class: 'note', text: `總答對率：${okN} / ${totalN}（${Math.round((okN / totalN) * 100)}%）` }));
    const review = new Set();
    S.mcq.res.forEach((r, k) => { if (r && !r.ok) review.add(L.mcq[k].word || L.mcq[k].q); });
    S.cloze.res.forEach((r, k) => { if (r && !r.ok) review.add(L.cloze[k].answer); });
    S.tr.res.forEach((r, k) => { if (r && r.ok === false) L.translate[k].keywords.forEach((w) => review.add(w)); });
    out.push(el('div', { class: 'label', text: '建議複習的單字' }),
      review.size ? el('div', { class: 'review' }, ...[...review].map((w) => el('button', { class: 'pick', type: 'button', title: '聽發音', onclick: () => say(w, 0.8), text: w }))) : el('div', { class: 'note', text: '目前沒有答錯的單字。' }));
  }
  const weak = S.shadow.items.filter((x) => x.rec && x.rec.hasSR && x.rec.score < 70);
  if (weak.length) {
    out.push(el('div', { class: 'label', text: '建議再跟讀的句子（低於 70 分）' }),
      el('ul', { class: 'issues' }, ...weak.map((x) => el('li', {},
        el('span', { class: 'sc low', text: x.rec.score }), el('span', { text: x.text }),
        el('button', { class: 'btn small', type: 'button', text: '再練一次', onclick: () => { S.shadow.i = S.shadow.items.indexOf(x); goStep(2); } })))));
  }
  out.push(el('div', {}, el('button', { class: 'btn', type: 'button', text: '全部重做', onclick: () => {
    S.mcq = { i: 0, res: [] }; S.cloze = { i: 0, res: [] }; S.tr = { i: 0, res: [] };
    S.shadow.items.forEach((x) => { if (x.rec?.url) URL.revokeObjectURL(x.rec.url); delete x.rec; });
    goStep(0);
  } })));
  return out;
}

/* ================= boot ================= */
if (location.protocol === 'file:') {
  showBanner('請不要直接雙擊開啟 index.html。請在這個資料夾執行 python server.py，再用 Chrome 開啟 http://localhost:8000');
}
resetState(null);
const startId = parseVideoId(new URLSearchParams(location.search).get('v') || '') || storeGet('lastVideo') || parseVideoId(DEFAULT_URL);
loadVideo(startId);
</script>
